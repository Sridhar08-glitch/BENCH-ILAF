# Proxy settings for customer domains (deploy/nginx/bench-customdomains.conf includes it).
# Install as /etc/nginx/snippets/bench-web-proxy-custom.conf.
# Like bench-web-proxy.conf, with two differences: the three headers only the web app's middleware may set are blanked (a visitor
# cannot make the web app think a request came from somebody else's domain), and the security headers repeat the server block's.
proxy_pass http://bench_web_upstream;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header x-bench-custom-host "";
proxy_set_header x-bench-custom-ws "";
proxy_set_header x-bench-custom-root "";
proxy_connect_timeout 5s;
proxy_read_timeout 60s;
proxy_send_timeout 60s;
proxy_redirect off;

add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
