# Shared proxy settings for the BENCH API locations.
# Install as /etc/nginx/snippets/bench-proxy.conf (bench-api.conf includes it).
# X-Forwarded-For is overwritten with the address nginx saw (never appended), so the first entry Django reads cannot be
# forged by the visitor. CF-Connecting-IP is blanked so it cannot be forged either.
proxy_pass http://bench_api_upstream;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header CF-Connecting-IP "";
proxy_connect_timeout 5s;
proxy_read_timeout 60s;
proxy_send_timeout 60s;
proxy_redirect off;

# Security headers repeated here because a location that sets add_header drops the ones of the server block.
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
