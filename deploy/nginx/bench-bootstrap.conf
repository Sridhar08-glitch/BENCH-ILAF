# BENCH first-run server block: answers on port 80 only, so certbot can prove the host names are yours.
# Used once, BEFORE the certificate exists (README-DEPLOY.md, "DNS and TLS"). Replace both host names, then:
#     sudo sed -i 's/__WEB_HOST__/app.example.com/g; s/__API_HOST__/api.example.com/g' /etc/nginx/sites-available/bench-bootstrap.conf
# After the certificate is issued, remove this file from sites-enabled and enable bench-web.conf and bench-api.conf.
server {
    listen 80;
    listen [::]:80;
    server_name __WEB_HOST__ __API_HOST__;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 404; }
}
