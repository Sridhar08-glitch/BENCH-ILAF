# BENCH custom domains: the nginx alternative to deploy/caddy/Caddyfile (use it when nginx already owns ports 80 and 443).
#
# How it works
#   - A catch-all server block answers every customer domain. The certificate for each name is looked up by name:
#     /etc/letsencrypt/live/<name>/fullchain.pem. deploy/custom-domains/issue_certs.sh (cron, every 10 minutes) asks the API which
#     domains are verified and Enterprise-live (manage.py list_custom_domains) and runs certbot for each one that has no certificate yet.
#   - A name without a certificate (not verified, no plan, certificate not issued yet) fails the TLS handshake: ssl_reject_handshake.
#   - Requests are passed to the Next.js web app with the Host header unchanged; the web app decides what to show (that company's cards
#     only; the dashboard is never served on a customer domain).
#
# Needs nginx 1.19.4 or newer (ssl_reject_handshake) and 1.15.9 or newer (variables in ssl_certificate).
# Install as /etc/nginx/sites-available/bench-customdomains.conf (link into sites-enabled) AFTER bench-http.conf (it defines the upstream
# and log format) and the snippet bench-web-proxy.conf. Replace __WEB_HOST__ and __API_HOST__:
#     sudo sed -i 's/__WEB_HOST__/app.example.com/g; s/__API_HOST__/api.example.com/g' /etc/nginx/sites-available/bench-customdomains.conf
#
# IMPORTANT: this block must not take over names that other server blocks own. It uses a regular-expression server_name: nginx tries
# exact names first (bench-web.conf, bench-api.conf and the other app on this machine keep theirs), then wildcards, then the first
# matching regular expression, and only then the default_server. So only names nobody else claims fall into this block, and no
# default_server is needed here (do not add one if another app already has it). The web app answers 404 to a host it does not know.

# The challenge for certbot (webroot): plain http, any name.
server {
    listen 80;
    listen [::]:80;
    server_name ~^.+$;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

# https for every name that has a certificate under /etc/letsencrypt/live/<name>/.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ~^.+$;

    # One certificate per customer domain, picked by the name the browser asked for (SNI). A name with no certificate file fails the
    # handshake with an error log line, never a wrong certificate.
    ssl_certificate     /etc/letsencrypt/live/$ssl_server_name/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/$ssl_server_name/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:BENCH_CUSTOM_SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    access_log /var/log/nginx/bench-customdomains.access.log bench;
    error_log  /var/log/nginx/bench-customdomains.error.log warn;

    server_tokens off;
    client_max_body_size 1m;       # a card page only receives small forms
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    limit_conn bench_conn 40;
    limit_req_status 429;
    limit_conn_status 429;

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain text/xml;
    gzip_min_length 512;
    gzip_vary on;
    gzip_proxied any;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # HSTS without includeSubDomains/preload: the customer owns the rest of their domain.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Second lock: the dashboard and its API routes never answer on a customer domain (the web app also redirects them).
    location ~ ^/(app|staff)(/|$) { return 302 https://__WEB_HOST__$request_uri; }
    location ~ ^/api/(proxy|session)(/|$) { return 404; }

    location /card-library/ {
        alias /srv/bench/app/web/public/card-library/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files $uri =404;
    }
    location /card-fonts/ {
        alias /srv/bench/app/web/public/card-fonts/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files $uri =404;
    }
    location /_next/static/ {
        alias /srv/bench/app/web/.next/static/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files $uri =404;
    }

    location / {
        limit_req zone=bench_web burst=60 nodelay;
        include /etc/nginx/snippets/bench-web-proxy-custom.conf;
    }
}
