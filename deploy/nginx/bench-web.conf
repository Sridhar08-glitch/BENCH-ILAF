# BENCH web app  ->  https://__WEB_HOST__   (cards live at /c/<name>, the dashboard at /app)
# Install as /etc/nginx/sites-available/bench-web.conf (link into sites-enabled) after bench-http.conf, the snippet
# bench-web-proxy.conf and the certificate (README-DEPLOY.md). Replace the host name:
#     sudo sed -i 's/__WEB_HOST__/app.example.com/g' /etc/nginx/sites-available/bench-web.conf
# No default_server here (the other app on this server owns it).
#
# CARD DOMAIN: if the owner later chooses a short card domain (NEXT_PUBLIC_PUBLIC_HOST), add a third server block for it
# that answers  location ~ ^/([A-Za-z0-9_-]+)$ { return 301 https://__WEB_HOST__/c/$1; }  and get a certificate for it.
# COMPANY DOMAINS (Enterprise): customer domains such as cards.northgate.com are served by their own catch-all block, see
# bench-customdomains.conf and deploy/CUSTOM_DOMAINS.md (or by Caddy). They never share this server block.

server {
    listen 80;
    listen [::]:80;
    server_name __WEB_HOST__;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __WEB_HOST__;

    ssl_certificate     /etc/letsencrypt/live/bench/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bench/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:BENCH_SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    access_log /var/log/nginx/bench-web.access.log bench;
    error_log  /var/log/nginx/bench-web.error.log warn;

    server_tokens off;
    # The web app forwards uploads (card photos, logos, covers up to 8 MB) to the API, so it needs the same ceiling.
    client_max_body_size 12m;
    client_body_timeout 30s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    limit_conn bench_conn 40;
    limit_req_status 429;
    limit_conn_status 429;

    # Compression for pages, scripts, styles and the 2.2 MB card stylesheet (about 300 KB on the wire).
    gzip on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain text/xml;
    gzip_min_length 512;
    gzip_comp_level 5;
    gzip_vary on;
    gzip_proxied any;

    # Security headers (repeated in the locations that add their own headers, see bench-web-proxy.conf).
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # Content-Security-Policy in REPORT-ONLY mode: browsers log what would be blocked (open the browser console) but
    # block nothing. After one week of clean testing, rename the header to Content-Security-Policy.
    # Why these sources: Google Sign-In script and frame, (the card fonts are self-hosted, no font host is allowed),
    # pictures from the API host (https:), the card photo preview (data:, blob:), the scanner's OCR worker (blob:, wasm).
    # 'unsafe-inline' is needed by Next.js inline scripts and by the card styles; a nonce-based policy is the stricter later step.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://accounts.google.com; font-src 'self' data:; img-src 'self' data: blob: https:; connect-src 'self' https://__API_HOST__ https://accounts.google.com; frame-src https://accounts.google.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # The card stylesheet carries a content hash (?v=) in its address, so it may be cached for a year. Served from disk.
    location /card-library/ {
        alias /srv/bench/app/web/public/card-library/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files $uri =404;
    }

    # Self-hosted card fonts (web/public/card-fonts, written by the web build). File names carry the font version.
    location /card-fonts/ {
        alias /srv/bench/app/web/public/card-fonts/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files $uri =404;
    }

    # Next.js build output: file names contain a hash, safe to cache for a year.
    location /_next/static/ {
        alias /srv/bench/app/web/.next/static/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files $uri =404;
    }

    # Brand pictures and the scanner's OCR files (about 16 MB, loaded only on the scan page). One week.
    location ~ ^/(brand|ocr)/ {
        root /srv/bench/app/web/public;
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files $uri =404;
    }

    # Sign-in, sign-up and invitation go through the web app's own /api/session routes: 10 per minute per address.
    # Django's own limit cannot tell visitors apart on this path (the web server is the caller), so this one matters.
    location /api/session/ {
        limit_req zone=bench_auth burst=10 nodelay;
        include /etc/nginx/snippets/bench-web-proxy.conf;
    }

    # Everything the signed-in app asks of the API, the icon search and the other web API routes.
    location /api/ {
        limit_req zone=bench_api burst=60 nodelay;
        include /etc/nginx/snippets/bench-web-proxy.conf;
    }

    # Pages. Public cards (/c/..) and the company directory are cached for a few seconds by Next itself.
    location / {
        limit_req zone=bench_web burst=60 nodelay;
        include /etc/nginx/snippets/bench-web-proxy.conf;
    }
}
