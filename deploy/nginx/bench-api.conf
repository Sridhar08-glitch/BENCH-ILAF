# BENCH API  ->  https://__API_HOST__
# Install as /etc/nginx/sites-available/bench-api.conf (link into sites-enabled), after bench-http.conf and after the
# certificate exists (README-DEPLOY.md, step "DNS and TLS"). Replace __API_HOST__ with the real host name:
#     sudo sed -i 's/__API_HOST__/api.example.com/g' /etc/nginx/sites-available/bench-api.conf
#
# There is NO default_server here: the other app on this server already owns the catch-all. If the certificate is not
# there yet, use bench-bootstrap.conf first.
#
# nginx 1.24 (Ubuntu 24.04) syntax: "listen ... http2" (the newer "http2 on;" needs nginx 1.25.1 or later).
# What this file does
#   * redirects http to https, serves the Let's Encrypt challenge
#   * proxies the API to gunicorn on 127.0.0.1:8101 and tells Django the request was https and who the visitor is
#   * serves uploaded pictures (/media/) and admin static files (/static/) straight from disk with long cache
#   * never serves the private export folder (it is not under /media/ and no location points at it)
#   * rate-limits sign-in, public contact forms and public card reads before they reach Django
#   * limits upload size to match the app: pictures are capped at 8 MB in code (MAX_UPLOAD_BYTES) and the whole request
#     body at 10 MB (DATA_UPLOAD_MAX_MEMORY_SIZE), so 12 MB leaves room for multipart overhead

server {
    listen 80;
    listen [::]:80;
    server_name __API_HOST__;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __API_HOST__;

    # TLS. The certificate is created by certbot (cert name "bench", covers the web and the API host).
    ssl_certificate     /etc/letsencrypt/live/bench/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bench/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:BENCH_SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    # OCSP stapling (optional; needs a resolver):  ssl_stapling on; ssl_stapling_verify on; resolver 1.1.1.1 9.9.9.9 valid=300s;

    access_log /var/log/nginx/bench-api.access.log bench;
    error_log  /var/log/nginx/bench-api.error.log warn;

    server_tokens off;
    client_max_body_size 12m;
    client_body_timeout 30s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    limit_conn bench_conn 40;
    limit_req_status 429;
    limit_conn_status 429;

    gzip on;
    gzip_types application/json application/javascript text/plain text/css text/xml text/vcard text/csv image/svg+xml;
    gzip_min_length 512;
    gzip_comp_level 5;
    gzip_vary on;
    gzip_proxied any;

    # Headers for every reply of the API (JSON never needs to be framed, sniffed or cached by shared caches).
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Proxy settings shared by the locations below (copied into each location because add_header/proxy_set_header
    # are not inherited once a location sets its own).
    # X-Forwarded-For is OVERWRITTEN with the address nginx really saw, not appended: Django (TRUST_PROXY_HEADERS=true)
    # takes the FIRST entry, and a client-supplied first entry would let anyone dodge the rate limits.
    # CF-Connecting-IP is blanked for the same reason. If Cloudflare is put in front later, see README-DEPLOY.md.
    # ----------------------------------------------------------------------------------------------------------

    # Health check for the monitoring scripts (cheap, no secrets in the answer).
    location = /health/ {
        proxy_pass http://bench_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP "";
        access_log off;
    }

    # Uploaded pictures: photos, logos, covers, favicons. Public by design; file names carry a random part and every
    # picture was re-encoded by the app (no SVG, no HTML). The open CORS header lets a browser draw a company logo on a
    # canvas (call-background maker). The restrictive CSP stops a stray file from running anything.
    # Uploaded PDFs (the "Download file" buttons): always downloaded, never shown inside this site, never sniffed. A stricter
    # rule than the pictures above (the pictures' sandbox policy would also stop a browser's PDF viewer).
    location /media/files/ {
        alias /srv/bench/data/media/files/;
        autoindex off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header Content-Disposition "attachment" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files $uri =404;
    }

    location /media/ {
        alias /srv/bench/data/media/;
        autoindex off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; sandbox" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files $uri =404;
    }

    # Admin interface files (collectstatic output).
    location /static/ {
        alias /srv/bench/app/backend/staticfiles/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files $uri =404;
    }

    # Sign-in, sign-up, password reset, Google sign-in, invitations: 10 per minute per address, bursts of 10.
    # (Django has its own per-address limits too; this stops floods before they reach Python.)
    location ~ ^/api/v1/(auth/(login|register|forgot|reset|google|restore)|invites/) {
        limit_req zone=bench_auth burst=10 nodelay;
        include /etc/nginx/snippets/bench-proxy.conf;
    }

    # Public contact forms and meeting requests on a card: 20 per minute per address.
    location ~ ^/api/v1/public/cards/[^/]+/(leads|meeting-requests)$ {
        limit_req zone=bench_lead burst=10 nodelay;
        include /etc/nginx/snippets/bench-proxy.conf;
    }

    # Public card reads, visit events, vCard, QR pictures, directory: 10 per second per address, bursts of 40.
    location /api/v1/public/ {
        limit_req zone=bench_public burst=40 nodelay;
        include /etc/nginx/snippets/bench-proxy.conf;
    }

    # Stripe calls this from Stripe's servers: no rate limit (the signature is verified in Django). Parked for now.
    location = /api/v1/stripe/webhook {
        include /etc/nginx/snippets/bench-proxy.conf;
    }

    # Django admin (staff only). Restrict it to the office or VPN addresses: copy the allow list from
    # bench-admin-allow.conf.example (next to this file) and replace the placeholder addresses:
    #   allow 203.0.113.10;
    #   deny all;
    location /admin/ {
        limit_req zone=bench_auth burst=20 nodelay;
        include /etc/nginx/snippets/bench-proxy.conf;
        add_header Cache-Control "no-store" always;
        add_header X-Frame-Options DENY always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # Everything else on the API.
    location / {
        limit_req zone=bench_api burst=60 nodelay;
        include /etc/nginx/snippets/bench-proxy.conf;
    }
}
