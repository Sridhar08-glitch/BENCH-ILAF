# BENCH: settings that live at the nginx "http" level.
# Install as /etc/nginx/conf.d/bench-http.conf, then:  sudo nginx -t && sudo systemctl reload nginx
# (Files in conf.d are included inside the http block.) Every name starts with "bench" so nothing collides with the
# other app on this server. Compression is NOT set here on purpose: the other app already sets gzip options at this
# level and a second copy would be a "duplicate directive" error, so the BENCH server blocks set their own.

# Request-rate zones, one counter per client address. Used by bench-api.conf and bench-web.conf.
# 10 MB holds about 160,000 addresses per zone.
limit_req_zone $binary_remote_addr zone=bench_auth:10m   rate=10r/m;   # sign-in, register, password reset
limit_req_zone $binary_remote_addr zone=bench_lead:10m   rate=20r/m;   # public contact forms and meeting requests
limit_req_zone $binary_remote_addr zone=bench_public:10m rate=10r/s;   # public card reads, directory, QR
limit_req_zone $binary_remote_addr zone=bench_api:10m    rate=20r/s;   # everything else on the API
limit_req_zone $binary_remote_addr zone=bench_web:10m    rate=20r/s;   # web pages
limit_conn_zone $binary_remote_addr zone=bench_conn:10m;

log_format bench '$remote_addr - [$time_iso8601] "$request" $status $body_bytes_sent '
                 '"$http_referer" rt=$request_time urt=$upstream_response_time';

upstream bench_api_upstream { server 127.0.0.1:8101; keepalive 16; }
upstream bench_web_upstream { server 127.0.0.1:3101; keepalive 16; }
