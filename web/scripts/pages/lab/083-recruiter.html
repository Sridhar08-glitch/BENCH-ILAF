<style>

.p206 .in{--sand:#f6e5c8;--sand-d:#ecd3a8;--ink:#33201a;--ac:color-mix(in oklab,var(--cacc) 22%,#d9503f);--ac-on:oklch(from var(--ac) clamp(0,(0.68 - l)*1000,1) 0 0);--ac-t:oklch(from var(--ac) .46 c h);--body:Nunito,Cairo,"Segoe UI",system-ui,sans-serif;--mark:"Permanent Marker",Cairo,"Comic Sans MS",cursive}
