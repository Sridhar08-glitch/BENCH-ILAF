<section class="page" data-no="207" data-name="Insurance advisor" data-style="Business" data-rtl="0">

<style>
/* colour: sky, umbrella and the soft aqua page are the style; the blue (shield rim, role pill, policy stripes, first card) is nudged toward the card accent (--ac, text --ac-on) */
.p207 .in{--page:#e6f5fa;--ink:#0b3a60;--mute:#46677f;--ac:color-mix(in oklab,var(--cacc) 7%,#1b78c2);--ac-on:oklch(from var(--ac) clamp(0,(0.68 - l)*1000,1) 0 0);--ac-t:oklch(from var(--ac) .42 c h);--sans:Figtree,Tajawal,"Segoe UI",system-ui,sans-serif;--shield:polygon(50% 0,94% 10%,94% 54%,84% 72%,66% 88%,50% 100%,34% 88%,16% 72%,6% 54%,6% 10%)}
.p207 *{box-sizing:border-box;margin:0}
.p207 .in{font-family:var(--sans);color:var(--ink);background:var(--page);position:relative;overflow:hidden}
.p207 a{color:inherit;text-decoration:none}
.p207 :focus-visible{outline:0.769cqw solid var(--ac);outline-offset:0.5cqw}
.p207 .sky{position:relative;height:96cqw;background:linear-gradient(180deg,#73c3e4,#e6f5fa);overflow:hidden}
.p207 .sky .art{position:absolute;inset:0;background:#9fd5ea url(/card-library/art/insurance-bg.webp) center top/100% auto no-repeat}
.p207 .sky:after{content:"";position:absolute;inset-inline:0;bottom:0;height:26cqw;background:linear-gradient(180deg,rgba(230,245,250,0),var(--page) 92%)}
.p207 .co{position:absolute;z-index:2;top:5cqw;inset-inline-start:5cqw;max-width:60cqw;padding:2cqw 4cqw;border-radius:99cqw;background:rgba(255,255,255,.9);color:var(--ink);font-weight:700;font-size:max(11px,3.3cqw);line-height:1.2;box-shadow:0 1cqw 3cqw rgba(15,80,130,.2);overflow-wrap:anywhere}
.p207 .mid{position:relative;z-index:2;margin-top:-38cqw;padding:0 6cqw 6cqw;text-align:center}
.p207 .shw{width:40cqw;margin:0 auto;filter:drop-shadow(0 2.6cqw 3cqw rgba(15,80,130,.38))}
.p207 .shw .rim{padding:1.8cqw;background:linear-gradient(160deg,#fff,#cfe9f6 60%,var(--ac));clip-path:var(--shield);aspect-ratio:1/1.12}
.p207 .shin{width:100%;height:100%;clip-path:var(--shield);overflow:hidden;background:#cfe9f6}
.p207 .shin .pic,.p207 .shin svg{width:100%;height:100%;display:grid;place-items:center;background:linear-gradient(170deg,#9fd5ea,var(--ac));color:#fff;font-family:var(--sans);font-weight:800;font-size:38cqw;line-height:1;padding-bottom:3cqw}
.p207 h1{margin-top:4.4cqw;font-weight:800;font-size:9.4cqw;line-height:1.02;letter-spacing:-.02em;overflow-wrap:anywhere}
.p207 h1 span{display:block}
.p207.wl2 h1{font-size:7.4cqw}.p207.wl3 h1{font-size:5.8cqw}.p207.nl3 h1{font-size:6.4cqw}.p207.nl3.wl3 h1{font-size:5cqw}
.p207[dir="rtl"] h1{font-family:Tajawal,var(--sans);font-weight:800;font-size:9cqw;line-height:1.25;letter-spacing:0}
.p207[dir="rtl"].wl2 h1{font-size:7.2cqw}.p207[dir="rtl"].nl3 h1{font-size:5.8cqw}
.p207 .role{display:inline-flex;align-items:center;gap:2cqw;margin-top:3.6cqw;padding:2.2cqw 4.6cqw;border-radius:99cqw;background:var(--ac);color:var(--ac-on);font-weight:700;font-size:max(12px,3.8cqw);line-height:1.25;box-shadow:0 1.6cqw 3cqw rgba(15,80,130,.28);overflow-wrap:anywhere;text-align:center}
.p207 .where{margin-top:2.6cqw;font-weight:600;font-size:max(11px,3.5cqw);color:var(--mute);line-height:1.3;overflow-wrap:anywhere}
.p207 .dk{padding:3cqw 5cqw 9cqw}
.p207 .bio{margin-bottom:6cqw;padding:5cqw 5.4cqw 5cqw;border-radius:4cqw;background:#fff;color:#12466f;font-weight:500;font-size:4.5cqw;line-height:1.45;overflow-wrap:anywhere;box-shadow:0 1.6cqw 4cqw rgba(15,80,130,.14),inset 0 0 0 1px rgba(27,120,194,.18)}
.p207 .bio .bh{display:flex;align-items:center;gap:2cqw;margin-bottom:2cqw;font-weight:800;font-size:max(10px,2.9cqw);letter-spacing:.14em;text-transform:uppercase;color:var(--ac-t)}
.p207 .bio .bh:before{content:"";flex:none;width:4cqw;height:4.6cqw;background:var(--ac);clip-path:var(--shield)}
.p207[dir="rtl"] .bio .bh{letter-spacing:0;text-transform:none;font-size:max(12px,3.6cqw)}
.p207 .pol{display:flex;flex-direction:column;gap:3cqw}
.p207 .pc{position:relative;display:flex;align-items:center;gap:4cqw;min-height:19cqw;padding:3cqw 4.6cqw 3cqw 4cqw;border-radius:4cqw;background:#fff;box-shadow:0 1.6cqw 4cqw rgba(15,80,130,.14),inset 0 0 0 1px rgba(27,120,194,.16);overflow:hidden;min-width:0}
.p207 .pc:before{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:1.8cqw;background:var(--ac)}
.p207 .pc:hover{box-shadow:0 1.6cqw 4cqw rgba(15,80,130,.26),inset 0 0 0 1px var(--ac)}
.p207 .pc .ic{flex:none;width:12cqw;height:13.4cqw;display:grid;place-items:center;background:var(--ac);color:var(--ac-on);clip-path:var(--shield);padding-bottom:1.2cqw;margin-inline-start:1.4cqw}
.p207 .pc .ic svg{width:5.8cqw;height:5.8cqw;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.p207 .pc .tx{flex:1;min-width:0}
.p207 .pc b{display:block;font-weight:800;font-size:max(13px,4.4cqw);line-height:1.2;overflow-wrap:anywhere}
.p207 .pc small{display:block;margin-top:0.8cqw;font-weight:500;font-size:max(12px,3.8cqw);color:var(--mute);line-height:1.25;overflow-wrap:anywhere}
.p207 .pc .no{flex:none;align-self:flex-start;margin-top:-1cqw;font-weight:800;font-size:max(10px,2.8cqw);letter-spacing:.1em;color:var(--ac-t);opacity:.75}
.p207 .pol>:first-child{background:linear-gradient(135deg,var(--ac),color-mix(in oklab,var(--ac) 70%,#0b3a60));color:var(--ac-on);box-shadow:0 2cqw 4.4cqw rgba(15,80,130,.35)}
.p207 .pol>:first-child:before{background:rgba(255,255,255,.55)}
.p207 .pol>:first-child .ic{background:#fff;color:var(--ac-t)}
.p207 .pol>:first-child small,.p207 .pol>:first-child .no{color:inherit;opacity:.92}

</div>
