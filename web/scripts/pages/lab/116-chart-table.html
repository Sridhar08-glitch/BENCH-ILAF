<style>

.p239 .in{--pa:#efe2bf;--pa2:#e4d2a4;--navy:#1c3350;--brass:#b8862e;--sig:#a8321f;--ac:color-mix(in oklab,var(--cacc) 30%,var(--sig));--ac-on:oklch(from var(--ac) clamp(0,(0.68 - l)*1000,1) 0 0);--ac-d:oklch(from var(--ac) min(l,.42) c h)}
