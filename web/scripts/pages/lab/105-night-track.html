<style>
/* colour: charcoal asphalt and neon lime are the style; the lime itself (slab, name, rows) follows the card accent lightly via --ac (text on it --ac-on) */
.p228 .in{--ch:#121518;--ch2:#1c2126;--lime:#c6ff00;--ac:color-mix(in oklab,var(--cacc) 14%,var(--lime));--ac-on:oklch(from var(--ac) clamp(0,(0.7 - l)*1000,1) 0 0);--ac-t:oklch(from var(--ac) clamp(.78,l,.97) c h);--bc:"Barlow Condensed","Cairo",Impact,"Arial Narrow",sans-serif;--mono:"DM Mono","IBM Plex Mono","Courier New",monospace}
.p228 *{box-sizing:border-box;margin:0}
.p228 .in{font-family:var(--bc);color:#fff;background:var(--ch);position:relative;overflow:hidden}
.p228 a{color:inherit;text-decoration:none}
.p228 :focus-visible{outline:0.769cqw solid var(--ac);outline-offset:0.5cqw}
.p228 .hd{position:relative;padding-bottom:10cqw}
.p228 .cov{height:128cqw;background:url(/card-library/art/track-bg.webp) 50% 0/cover,linear-gradient(160deg,#0b0e12,#1d242c);clip-path:polygon(0 0,100% 0,100% 84%,0 97%);position:relative}
.p228 .cov:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(18,21,24,.55) 0,rgba(18,21,24,0) 24%,rgba(18,21,24,0) 52%,rgba(18,21,24,.6) 92%)}
.p228 .mast{position:absolute;top:5cqw;inset-inline-start:5.6cqw;z-index:2;display:flex;align-items:center;gap:2.4cqw;font-family:var(--mono);font-weight:500;font-size:max(10px,2.9cqw);letter-spacing:.2em;text-transform:uppercase;color:#fff;max-width:70%;line-height:1.3;overflow-wrap:anywhere}
.p228 .mast:before{content:"";flex:none;width:7cqw;height:1.4cqw;background:var(--ac);transform:skewX(-30deg)}
.p228[dir="rtl"] .mast{letter-spacing:0}
.p228 .slab{position:absolute;top:28cqw;inset-inline-end:3cqw;width:46cqw;height:58cqw;background:var(--ac);clip-path:polygon(16% 0,100% 0,84% 100%,0 100%);transform:translate(2.6cqw,2.6cqw);z-index:1}

.p228 .nm{position:absolute;inset-inline-start:5cqw;top:60cqw;z-index:3;width:92%}

.p228 .sets a{counter-increment:s;position:relative;display:flex;align-items:stretch;min-height:17cqw;background:var(--ch2);transform:skewX(-10deg);min-width:0;box-shadow:0 .6cqw 0 rgba(0,0,0,.4)}
.p228[dir="rtl"] .sets a{transform:skewX(10deg)}

.p228 .ic svg{width:6.6cqw;height:6.6cqw;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transform:skewX(10deg)}
.p228[dir="rtl"] .ic svg{transform:skewX(-10deg)}
.p228 .t{flex:1;min-width:0;display:block;padding:2.6cqw 4cqw;transform:skewX(10deg);align-self:center}
.p228[dir="rtl"] .t{transform:skewX(-10deg)}
.p228 .t b{display:block;font-weight:700;font-size:max(14px,5.8cqw);letter-spacing:.04em;text-transform:uppercase;line-height:1.05;overflow-wrap:anywhere}
.p228[dir="rtl"] .t b{font-family:Cairo,var(--bc);text-transform:none;letter-spacing:0;font-size:4.8cqw}
.p228 .t small{display:block;margin-top:.8cqw;font-family:var(--mono);font-size:max(10px,3cqw);letter-spacing:.04em;color:#aeb7bf;line-height:1.3;overflow-wrap:anywhere}
.p228 .sets a:after{content:counter(s,decimal-leading-zero);position:absolute;inset-inline-end:3.4cqw;top:50%;transform:translateY(-50%) skewX(10deg);font-weight:700;font-size:9cqw;line-height:1;color:transparent;-webkit-text-stroke:.35cqw rgba(198,255,0,.35);pointer-events:none}
.p228[dir="rtl"] .sets a:after{transform:translateY(-50%) skewX(-10deg)}
.p228 .sets a:last-child{margin-bottom:5cqw}
