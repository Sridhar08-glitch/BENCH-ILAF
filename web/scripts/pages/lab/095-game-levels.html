<style>
/* colour: the bright cyan sky and low-poly world with the navy outlines and gold are the signature and stay fixed; the card colour is mixed into the gold of the title ribbon and the first level (--ac fill, --ac-on) */
.p218 .in{--navy:#0a2a5a;--sky:#16b6ee;--gold:#ffc83d;--sig:#ffc83d;--ac:color-mix(in oklab,var(--cacc) 45%,var(--sig));--ac-on:oklch(from var(--ac) clamp(0,(0.68 - l)*1000,1) 0 0);--disp:"Lilita One","Bagel Fat One","Arial Rounded MT Bold",system-ui,sans-serif;--body:Nunito,"Plus Jakarta Sans",system-ui,sans-serif}
.p218[dir="rtl"] .in{--disp:Cairo,"Lilita One",sans-serif;--body:Cairo,Nunito,sans-serif}
.p218 *{box-sizing:border-box;margin:0}
.p218 .in{font-family:var(--body);color:var(--navy);background:linear-gradient(180deg,#16b6ee,#9be8ff);position:relative;overflow:hidden;font-weight:800}
.p218 a{color:inherit;text-decoration:none}
.p218 :focus-visible{outline:.9cqw solid var(--navy);outline-offset:.6cqw}
.p218 .hero{position:relative;min-height:150cqw;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;text-align:center;padding:0 5cqw 6cqw;background:url(/card-library/art/game-lowpoly-bg.webp) center top/cover no-repeat,linear-gradient(180deg,#16b6ee,#6fdcff 55%,#5fd35a)}
.p218 .hero::before{content:"";position:absolute;inset:auto 0 0;height:38%;background:linear-gradient(0deg,rgba(10,42,90,.55),rgba(10,42,90,0));pointer-events:none}
.p218 .hero>*{position:relative}
.p218 .hex{width:36cqw;aspect-ratio:1/1.1547;background:linear-gradient(160deg,#fff2a8,var(--gold) 40%,#e08a1e);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);padding:1.6cqw;margin-bottom:5cqw;filter:drop-shadow(0 1.6cqw 0 rgba(10,42,90,.6))}
.p218 .av{width:100%;height:100%;overflow:hidden;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:#0e4a8c}
.p218 .av .pic{display:grid;place-items:center;width:100%;height:100%;font-family:var(--disp);font-weight:400;font-size:42cqw;color:#fff;background:linear-gradient(160deg,#2d8bff,#7a5cff)}
.p218 .hex{position:absolute;top:13cqw;inset-inline:0;margin-inline:auto}
.p218 h1{font-family:var(--disp);font-weight:400;font-size:19cqw;line-height:.95;color:#fff;-webkit-text-stroke:1.7cqw var(--navy);paint-order:stroke fill;text-shadow:0 1.8cqw 0 var(--navy);letter-spacing:.01em;overflow-wrap:anywhere}
.p218 h1 span{display:block;color:var(--gold)}
.p218.wl2 h1{font-size:14.5cqw}.p218.wl3 h1{font-size:10.5cqw}.p218.nl3 h1{font-size:10.5cqw}
.p218[dir="rtl"] h1{font-weight:800;line-height:1.2;font-size:15cqw;-webkit-text-stroke:1.3cqw var(--navy);text-shadow:0 1.2cqw 0 var(--navy)}
.p218 .rb{margin-top:5.5cqw;position:relative;background:var(--ac);color:var(--ac-on);font-family:var(--disp);font-size:max(13px,4.4cqw);padding:1.8cqw 6cqw;border:.9cqw solid var(--navy);border-radius:1.6cqw;box-shadow:0 1.2cqw 0 var(--navy);max-width:100%;line-height:1.2;overflow-wrap:anywhere;letter-spacing:.02em}
.p218[dir="rtl"] .rb{font-weight:800}
.p218 .bd{display:flex;flex-wrap:wrap;justify-content:center;gap:2cqw;margin-top:4.5cqw}
.p218 .bd span{background:#fff;border:.8cqw solid var(--navy);border-radius:99cqw;padding:.9cqw 3.2cqw;font-size:max(11px,3.1cqw);line-height:1.25;box-shadow:0 .8cqw 0 var(--navy);overflow-wrap:anywhere;max-width:100%}
.p218 .bl{padding:5cqw 5cqw 9cqw;background-image:radial-gradient(rgba(255,255,255,.22) .5cqw,transparent .6cqw),linear-gradient(180deg,#27b4f0,#0f86d8);background-size:5cqw 5cqw,auto}
.p218 .bio{background:#fff;border:1cqw solid var(--navy);border-radius:4.4cqw;padding:4.6cqw 5cqw;font-size:4cqw;line-height:1.45;font-weight:700;box-shadow:0 1.4cqw 0 var(--navy);margin-bottom:7cqw;overflow-wrap:anywhere}
.p218 .bio b{display:inline-block;font-family:var(--disp);font-weight:400;background:var(--gold);border:.7cqw solid var(--navy);border-radius:99cqw;font-size:max(11px,3.2cqw);padding:.4cqw 3cqw;margin-bottom:2cqw}
.p218 .map{position:relative;display:flex;flex-direction:column}
.p218 .map a{position:relative;display:flex;align-items:center;gap:3cqw;height:16cqw;margin-bottom:9cqw}
.p218 .map a:last-child{margin-bottom:0}
.p218 .map a:nth-child(even){margin-inline-start:15cqw}
.p218 .map .ic{flex:none;position:relative;z-index:2;width:16cqw;height:16cqw;border-radius:50%;display:grid;place-items:center;background:#ff7a59;color:#fff;border:1cqw solid var(--navy);box-shadow:0 1.2cqw 0 var(--navy),inset 0 1cqw 0 rgba(255,255,255,.35)}
.p218 .map a:nth-child(5n+2) .ic{background:#a46bff}.p218 .map a:nth-child(5n+3) .ic{background:#ff5fa8}.p218 .map a:nth-child(5n+4) .ic{background:#2d8bff}.p218 .map a:nth-child(5n+5) .ic{background:#ff9d2e}
.p218 .map a:first-child .ic{background:var(--ac);color:var(--ac-on)}
.p218 .map .ic svg{width:7.4cqw;height:7.4cqw;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.p218 .map .sg{position:relative;flex:1;min-width:0;background:#fff;border:.9cqw solid var(--navy);border-radius:3.6cqw;padding:2cqw 3.4cqw 2cqw 5cqw;box-shadow:0 1.2cqw 0 var(--navy);height:100%;display:flex;flex-direction:column;justify-content:center}
.p218[dir="rtl"] .map .sg{padding:2cqw 5cqw 2cqw 3.4cqw}
.p218 .map .sg em{position:absolute;top:-3.4cqw;inset-inline-start:4cqw;background:var(--gold);border:.7cqw solid var(--navy);border-radius:99cqw;font-family:var(--disp);font-style:normal;font-weight:400;font-size:max(10px,2.8cqw);padding:.2cqw 2.4cqw;line-height:1.4}
.p218 .map .sg b{display:block;font-size:4cqw;font-weight:800;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p218 .map .sg small{display:block;margin-top:.5cqw;font-size:max(11px,2.9cqw);font-weight:700;color:#3a5f8f;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p218 .map a:hover .sg{transform:translateY(-.5cqw)}
.p218 .map a:not(:last-child)::after{content:"";position:absolute;z-index:1;top:8cqw;inset-inline-start:8cqw;height:28.3cqw;width:0;border-inline-start:1.2cqw dotted #fff;transform-origin:top center;transform:rotate(-32deg);filter:drop-shadow(0 .5cqw 0 rgba(10,42,90,.5))}
.p218 .map a:nth-child(even):not(:last-child)::after{transform:rotate(32deg)}
.p218[dir="rtl"] .map a:not(:last-child)::after{transform:rotate(32deg)}.p218[dir="rtl"] .map a:nth-child(even):not(:last-child)::after{transform:rotate(-32deg)}
</style>
<div class="pg p218"><div class="in">
<div class="hero">
 <div class="hex"><div class="av"><svg viewBox="0 0 10 10"><rect width="10" height="10" fill="#0e4a8c"/></svg></div></div>
 <h1>{first}<span>{last}</span></h1>
 <div class="rb">{title}</div>
 <div class="bd"><span class="co">{co}</span><span class="ct">{city}</span></div>
</div>
<div class="bl">

 <nav class="map">

 </nav>
</div>
</div></div>
