<style>
/* colour: black and gold foil are the signature (foil gradient, inks, page stay fixed); hairlines, corners, labels and rules take the card accent mixed 55% into the gold, lightened for the dark page */
.p126 .in{--sig:#d9b45a;--ac:color-mix(in oklab,var(--cacc) 55%,var(--sig));--ac-on:oklch(from var(--ac) clamp(0,(0.68 - l)*1000,1) 0 0);--ac-t:oklch(from var(--ac) clamp(.74,l,.96) c h);--g1:var(--ac-t);--ink:#efe6d2;--mute:#b3a688;--bg:#0b0a08;

.p126 *{box-sizing:border-box;margin:0}
.p126 .in{font-family:"Jost","Cairo",system-ui,sans-serif;color:var(--ink)}
.p126[dir="rtl"] .in,.p126[dir="rtl"] .in *{letter-spacing:0!important}
.p126 .in{background:radial-gradient(ellipse 90% 40% at 50% 0,#1d170b,transparent 70%),var(--bg);padding:4.615cqw;position:relative}
.p126 a{color:inherit;text-decoration:none}
.p126 .frame{position:relative;border:1px solid color-mix(in srgb,var(--g1) 55%,transparent);padding:1.538cqw}

.p126 .corner.a{top:-1.795cqw;inset-inline-start:-1.795cqw;border-width:2px 0 0 2px}
.p126 .corner.b{top:-1.795cqw;inset-inline-end:-1.795cqw;border-width:2px 2px 0 0}
.p126 .corner.c{bottom:-1.795cqw;inset-inline-start:-1.795cqw;border-width:0 0 2px 2px}
.p126 .corner.d{bottom:-1.795cqw;inset-inline-end:-1.795cqw;border-width:0 2px 2px 0}
.p126[dir="rtl"] .corner.a{border-width:2px 2px 0 0}.p126[dir="rtl"] .corner.b{border-width:2px 0 0 2px}
.p126[dir="rtl"] .corner.c{border-width:0 2px 2px 0}.p126[dir="rtl"] .corner.d{border-width:0 0 2px 2px}
.p126 .foil{background:var(--foil);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}

.p126 .seal{position:relative;margin:0 auto;width:43.077cqw;height:43.077cqw}

.p126 .phw .pic{object-fit:cover;display:grid;place-items:center;background:#120f08;font-family:"Cormorant Garamond","Amiri",serif;font-weight:700;font-size:38cqw;letter-spacing:0;line-height:1;color:#e9c96a}
.p126 .phw span.pic{background-image:var(--foil);background-size:100% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;background-color:#120f08}
.p126 .nm{margin-top:5.641cqw;text-align:center;font-family:"Cormorant Garamond","Amiri","Cairo",serif;font-weight:500;font-size:13.333cqw;line-height:1.02;letter-spacing:.01em;overflow-wrap:anywhere;hyphens:auto}

.p126 .nm .l{display:block}

.p126 .rule i{width:1.795cqw;height:1.795cqw;transform:rotate(45deg);border:1px solid var(--g1)}

.p126 .bio{margin:6.667cqw auto 0;max-width:80cqw;text-align:center;font-family:"Cormorant Garamond","Amiri","Cairo",serif;font-size:5.385cqw;line-height:1.35;font-style:italic;font-weight:500;color:#e7dcc2;overflow-wrap:anywhere}

.p126 .bl .fin{padding:4.615cqw 5.641cqw}
.p126 .idx{display:block}
.p126 .idx a{display:flex;align-items:baseline;gap:2.564cqw;min-height:13.333cqw;padding:3.59cqw 0;color:var(--ink);border-bottom:1px solid color-mix(in srgb,var(--g1) 20%,transparent)}
.p126 .idx a:first-child{border-top:1px solid color-mix(in srgb,var(--g1) 20%,transparent)}
.p126 .idx .n{font-family:"Cormorant Garamond",serif;font-size:max(10px,3.59cqw);color:var(--g1);min-width:5.641cqw;flex:none;font-style:italic}

.p126 .idx .d{flex:1;border-bottom:1px dotted color-mix(in srgb,var(--g1) 45%,transparent);transform:translateY(-1.026cqw);min-width:2.564cqw}
.p126 .idx .v{font-family:"Cormorant Garamond","Amiri","Cairo",serif;font-size:max(11px,4.872cqw);font-weight:700;text-align:end;overflow-wrap:anywhere;min-width:0;line-height:1.2}
.p126 .idx svg{width:4.359cqw;height:4.359cqw;fill:none;stroke:var(--g1);stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round;flex:none;align-self:center}
.p126 .idx a:hover .v,.p126 .idx a:focus-visible .v{color:#fff1b4}
.p126 a:focus-visible{outline:2px solid #fff1b4;outline-offset:0.769cqw}
@media (prefers-reduced-motion:no-preference){.p126 .foil{animation:sh 9s ease-in-out infinite alternate}
}
@keyframes sh{to{background-position:100% 0}
}
</style>
