<style>
/* colour: the putty plaster gallery wall, black frames, brass picture lights and white wall labels are the style; the red "sold" dots, the label rule and the focus ring follow the card accent (--ac, text --ac-t on white); light page */
.p246 .in{--wall:#dcd4c5;--ink:#241d18;--sig:#c2603f;--ac:color-mix(in oklab,var(--cacc) 55%,var(--sig));--ac-on:oklch(from var(--ac) clamp(0,(0.68 - l)*1000,1) 0 0);--ac-t:oklch(from var(--ac) clamp(.3,l,.5) c h);--serif:Newsreader,"Noto Naskh Arabic",Georgia,serif;--sans:"Instrument Sans","IBM Plex Sans Arabic",system-ui,sans-serif}
.p246 *{box-sizing:border-box;margin:0}
.p246 .in{font-family:var(--serif);color:var(--ink);background:var(--wall);position:relative;overflow:hidden}
.p246[dir="rtl"] .in{--serif:"Noto Naskh Arabic",Newsreader,Georgia,serif;--sans:"IBM Plex Sans Arabic","Instrument Sans",system-ui,sans-serif}
.p246 a{color:inherit;text-decoration:none}
.p246 :focus-visible{outline:0.769cqw solid var(--ac-t);outline-offset:0.769cqw}
.p246 .wall{position:relative;padding:54cqw 6cqw 9cqw;background:#d8d0c1 url(/card-library/art/gallery-wall-bg.webp) 50% 0/100% auto no-repeat;overflow:hidden}
.p246 .row{display:flex;gap:4cqw;align-items:flex-start}
.p246 .big{position:relative;flex:0 0 63cqw}
.p246 .lamp{position:absolute;top:-4.6cqw;inset-inline:0;margin-inline:auto;width:20cqw;height:1.8cqw;border-radius:1cqw;background:linear-gradient(180deg,#e6c27a,#9c7a37);z-index:2}
.p246 .lamp:before{content:"";position:absolute;inset-inline:0;margin-inline:auto;top:-2.6cqw;width:.9cqw;height:2.6cqw;background:#9c7a37}
.p246 .lamp:after{content:"";position:absolute;top:1.6cqw;left:50%;margin-left:-45cqw;width:90cqw;height:80cqw;background:linear-gradient(180deg,rgba(255,244,214,.55),rgba(255,244,214,0) 85%);clip-path:polygon(40% 0,60% 0,100% 100%,0 100%);pointer-events:none;z-index:-1}

.p246 .pf{position:relative}

.p246 .pv{aspect-ratio:4/5;background:#cdbfa6;overflow:hidden}

.p246 .meta span{display:block}
.p246[dir="rtl"] .meta{letter-spacing:0;text-transform:none}
.p246 .enq{position:relative;padding:8cqw 5.4cqw 0;background:radial-gradient(ellipse at 50% 0,#e4ddcf,#d6cdbc 72%);overflow:hidden}
.p246 .wt{margin-bottom:8cqw;padding-inline-start:4.4cqw;border-inline-start:0.9cqw solid var(--ink);font-style:italic;font-size:max(14px,5cqw);line-height:1.45;color:var(--ink);overflow-wrap:anywhere}

.p246 .enq h2{display:flex;align-items:center;gap:3cqw;margin-bottom:5cqw;font-family:var(--sans);font-weight:600;font-size:max(10px,3cqw);letter-spacing:.28em;text-transform:uppercase;color:#5c5148}
.p246 .enq h2:after{content:"";flex:1;height:.4cqw;background:#b8ae9b}
.p246[dir="rtl"] .enq h2{letter-spacing:0}
.p246 .labels{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4cqw 4cqw;padding-bottom:14cqw}
.p246 .pl{position:relative;display:flex;flex-direction:column;gap:1.4cqw;min-width:0;min-height:30cqw;padding:3.8cqw 3.8cqw 3.4cqw;background:#fbfaf6;border-top:0.6cqw solid var(--ink);box-shadow:.4cqw .8cqw 0 rgba(0,0,0,.05),1cqw 2.4cqw 4.6cqw rgba(40,28,14,.25)}
.p246 .pl:nth-child(even){transform:translateY(5cqw)}
.p246 .pl:last-child:nth-child(odd){grid-column:1/-1;min-height:22cqw}
.p246 .pl .n{font-family:var(--sans);font-size:max(10px,2.7cqw);letter-spacing:.14em;color:#8a7f72}
.p246 .pl svg{position:absolute;top:3.6cqw;inset-inline-end:3.6cqw;width:5.4cqw;height:5.4cqw;fill:none;stroke:var(--ink);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.p246 .pl .l{display:block;margin-top:2cqw;font-weight:600;font-size:max(14px,5cqw);line-height:1.15;overflow-wrap:anywhere}
.p246 .pl small{display:block;font-style:italic;font-size:max(12px,3.5cqw);line-height:1.3;color:#5c5148;overflow-wrap:anywhere}
.p246[dir="rtl"] .pl small{font-style:normal}
.p246 .pl:first-child:after{content:"";position:absolute;bottom:3.4cqw;inset-inline-end:3.4cqw;width:3cqw;height:3cqw;border-radius:50%;background:var(--ac)}
.p246 .pl:hover{background:#fff}
.p246 .floor{margin:0 -5.4cqw;height:12cqw;background:linear-gradient(180deg,#d4cab8 0 28%,#3a2c20 28% 32%,#6a4b34 32%,#4a3322)}
</style>
