<section class="page" data-no="203" data-name="Real estate" data-style="Business" data-rtl="0">
<!--recipe {"top":80,"style":"Business","name":"Real estate","slug":"080-real-estate","dir":"auto","split":"dk","avatar":"arch","cover":"view","coverArt":["art"],"cond":{"bio":"bio","hang":"title"},"lists":[{"c":"keys","role":"tiles","items":"all","tint":"none"}]}-->
<style>
/* colour: golden-hour sky and saffron page are the style; the saffron is nudged toward the card accent (--sun), tags rotate ink / paper / white / brick, the accent tints the listed-by label and the first tag */
.p203 .in{--sun:color-mix(in oklab,var(--cacc) 12%,#dcab35);--sun-d:oklch(from var(--sun) .42 c h);--ink:#2b1d10;--paper:#fbf4e2;--brick:#b0452a;--ac:var(--sun);--ac-on:oklch(from var(--ac) clamp(0,(0.68 - l)*1000,1) 0 0);--ser:"DM Serif Display","IBM Plex Sans Arabic",Georgia,serif;--sans:"Instrument Sans","IBM Plex Sans Arabic",system-ui,sans-serif}
.p203 *{box-sizing:border-box;margin:0}
.p203 .in{font-family:var(--sans);color:var(--ink);background:var(--sun);position:relative;overflow:hidden}
.p203 a{color:inherit;text-decoration:none}
.p203 :focus-visible{outline:0.769cqw solid var(--ink);outline-offset:0.5cqw}
.p203 .view{position:relative;height:90cqw;background:linear-gradient(180deg,#9cc0d8,#f0b36f);overflow:hidden}
.p203 .view .art{position:absolute;inset:0;background:#f0b36f url(/card-library/art/real-estate-bg.webp) center 30%/cover no-repeat}
.p203 .view:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(40,20,5,.28) 0,rgba(40,20,5,0) 30%,rgba(40,20,5,0) 70%,rgba(40,20,5,.35) 100%)}
.p203 .hang{position:absolute;top:0;inset-inline-start:8cqw;z-index:3;transform-origin:50% 0;transform:rotate(-4deg);width:46cqw}
.p203[dir="rtl"] .hang{transform:rotate(4deg)}
.p203 .hang .cord{position:absolute;left:calc(50% - .4cqw);top:0;width:.8cqw;height:9.6cqw;background:#3b2812;z-index:2}
.p203 .tag{position:relative;margin-top:4cqw;padding:12cqw 3cqw 4.6cqw;background:var(--paper);border-radius:2cqw;clip-path:polygon(16% 0,84% 0,100% 11%,100% 100%,0 100%,0 11%);-webkit-mask:radial-gradient(circle at 50% 5.6cqw,transparent 2.1cqw,#000 2.2cqw);mask:radial-gradient(circle at 50% 5.6cqw,transparent 2.1cqw,#000 2.2cqw);text-align:center;box-shadow:inset 0 0 0 1.5cqw var(--paper)}
.p203 .tag:before{content:"";position:absolute;inset:1.4cqw;border:0.4cqw dashed rgba(43,29,16,.35);border-radius:1.4cqw;clip-path:polygon(18% 0,82% 0,100% 9%,100% 100%,0 100%,0 9%)}
.p203 .tag b{display:block;font-weight:700;font-size:4.3cqw;line-height:1.12;letter-spacing:-.01em;text-transform:uppercase;overflow-wrap:anywhere}
.p203 .tag small{display:block;margin-top:1.4cqw;font-size:max(10px,2.9cqw);letter-spacing:.14em;text-transform:uppercase;color:#7a4a12;overflow-wrap:anywhere}
.p203 .sheet{position:relative;margin-top:-7cqw;padding:5cqw 6cqw 8cqw;background:var(--paper);border-radius:7cqw 7cqw 0 0;display:grid;grid-template-columns:32cqw 1fr;gap:5.4cqw;align-items:end}
.p203 .arch{margin-top:-17cqw;width:32cqw;height:40cqw;border-radius:16cqw 16cqw 1.6cqw 1.6cqw;overflow:hidden;background:#d4a35a;box-shadow:0 0 0 1.4cqw var(--paper),0 0 0 2cqw var(--ink),0 3cqw 6cqw rgba(60,30,5,.35)}
.p203 .arch .pic,.p203 .arch svg{width:100%;height:100%;display:grid;place-items:center;background:linear-gradient(170deg,#f1c06f,#b0452a);color:#fff7e2;font-family:var(--ser);font-size:38cqw;line-height:1}
.p203 .who{min-width:0;padding-bottom:1.6cqw}
.p203 .who .by{font-size:max(10px,2.9cqw);letter-spacing:.2em;text-transform:uppercase;font-weight:600;color:#7a4a12}
.p203 h1{margin-top:1.6cqw;font-family:var(--ser);font-weight:400;font-size:9.4cqw;line-height:.98;letter-spacing:-.01em;overflow-wrap:anywhere}
.p203.nl2 h1{font-size:7.8cqw}.p203.nl3 h1{font-size:6.4cqw}.p203.wl3 h1{font-size:5.6cqw}
.p203 .who .co{margin-top:2.6cqw;font-size:max(12px,3.8cqw);font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.p203 .who .pin{display:flex;gap:1.4cqw;align-items:center;margin-top:1cqw;font-size:max(11px,3.4cqw);color:#5a4630;overflow-wrap:anywhere}
.p203 .who .pin svg{flex:none;width:3.6cqw;height:3.6cqw;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.p203[dir="rtl"] .who .by,.p203[dir="rtl"] .tag small,.p203[dir="rtl"] .tag b,.p203[dir="rtl"] .kt b{letter-spacing:0;text-transform:none}
.p203[dir="rtl"] h1{font-family:"IBM Plex Sans Arabic",var(--sans);font-weight:700;font-size:8.4cqw;line-height:1.25}
.p203[dir="rtl"].nl2 h1{font-size:7cqw}.p203[dir="rtl"].nl3 h1{font-size:5.8cqw}
.p203 .dk{padding:6cqw 5cqw 10cqw;background:var(--sun)}
.p203 .bio{position:relative;margin-bottom:12cqw;padding:4.6cqw 5cqw;background:var(--paper);border-radius:2cqw;font-size:4.2cqw;line-height:1.45;font-weight:500;overflow-wrap:anywhere;box-shadow:0 1.4cqw 0 rgba(60,35,5,.25)}
.p203 .bio .bh{display:block;margin-bottom:1.8cqw;font-size:max(10px,2.8cqw);letter-spacing:.2em;text-transform:uppercase;font-weight:700;color:#7a4a12}
.p203[dir="rtl"] .bio .bh{letter-spacing:0;text-transform:none;font-size:max(12px,3.6cqw)}
.p203 .keys{position:relative;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12cqw 4cqw;padding-top:0}
.p203 .keys:before{content:"";position:absolute;inset-inline:-1cqw;top:-7.4cqw;height:1.8cqw;border-radius:1cqw;background:linear-gradient(180deg,#f4f4f0,#9b9588 60%,#5b564c);box-shadow:0 1cqw 1.6cqw rgba(60,35,5,.4)}
.p203 .kt{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:1cqw;min-height:41cqw;padding:12cqw 2.6cqw 4cqw;min-width:0;border-radius:4cqw 4cqw 2.4cqw 2.4cqw;background:var(--ink);color:#fbf4e2;box-shadow:0 2cqw 3cqw rgba(70,40,5,.4),inset 0 0 0 0.5cqw rgba(255,255,255,.18);transform:rotate(-1.4deg)}
.p203 .kt:nth-child(even){transform:rotate(1.2deg)}
.p203 .kt:nth-child(4n+2),.p203 .kt:nth-child(4n+3){background:var(--paper);color:var(--ink)}
.p203 .kt:nth-child(4n+3){background:#fff}
.p203 .kt:nth-child(4n+4){background:var(--brick);color:#fff}
.p203 .kt:hover{filter:brightness(1.06)}
.p203 .kt:before{content:"";position:absolute;left:calc(50% - .4cqw);top:-8.6cqw;width:.8cqw;height:13.4cqw;background:#3b2812;z-index:2}
.p203 .kt:after{content:"";position:absolute;left:calc(50% - 2.1cqw);top:2.8cqw;width:4.2cqw;height:4.2cqw;border-radius:50%;background:var(--sun);box-shadow:inset 0 0.5cqw 0.9cqw rgba(60,35,5,.55),0 0 0 0.7cqw rgba(255,255,255,.22)}
.p203 .kt .ic{display:grid;place-items:center;margin-top:1.2cqw}
.p203 .kt .ic svg{width:7cqw;height:7cqw;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.p203 .kt b{font-size:max(11px,3.3cqw);letter-spacing:.14em;text-transform:uppercase;font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.p203 .kt small{font-size:max(11px,3.4cqw);opacity:.92;line-height:1.25;overflow-wrap:anywhere;max-width:100%}
.p203 .keys>:first-child{background:linear-gradient(160deg,color-mix(in oklab,var(--ac) 20%,var(--ink)),var(--ink))}
</style>
<div class="pg p203"><div class="in">
<header class="view">
 <div class="art" aria-hidden="true"></div>
 <div class="hang"><span class="cord"></span><div class="tag"><b>{title}</b><small>{city}</small></div></div>
</header>
<div class="sheet">
 <div class="arch"></div>
 <div class="who">
  <p class="by">[[Listed by|بواسطة]]</p>
  <h1>{name}</h1>
  <p class="co">{co}</p>
 </div>
</div>
<div class="dk">
 <p class="bio"><span class="bh">[[Description|الوصف]]</span>{bio}</p>
 <div class="keys">
  <a class="kt"><span class="ic"><svg viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg></span><b>Call</b><small>{phone}</small></a>
 </div>
</div>
</div></div>
</section>
