<style>
/* colour: black, mustard sleeve and cream paper stay fixed (identity); the orange (record label, band, portrait disc, track numbers, surname) follows the card accent: --ac for fills, --ac-t for text on the light mustard/cream */
.p113 .in{
  --mus:#f0b429; --blk:#14110f; --cream:#f4ecd8; --teal:#1e5b57;
  --sig:#e2531f; --ac:color-mix(in oklab,var(--cacc) 55%,var(--sig)); --ac-on:oklch(from var(--ac) clamp(0,(0.68 - l)*1000,1) 0 0); --ac-t:oklch(from var(--ac) clamp(.3,l,.5) c h);
  --anton:"Anton","Impact","Arial Narrow",sans-serif; --mono:"DM Mono",ui-monospace,Consolas,monospace; --ser:"Fraunces",Georgia,serif;
}
.p113[dir="rtl"] .in{--anton:"Cairo","Anton",sans-serif;--mono:"Cairo","DM Mono",sans-serif;--ser:"Cairo","Fraunces",serif}
.p113 *{box-sizing:border-box;margin:0}
.p113 .in{color:var(--cream);font-family:var(--mono);background:var(--blk);padding-inline:3.59cqw;overflow:hidden}
.p113.bt .in{background:var(--cream);color:var(--blk);padding-inline:0}
.p113 a{color:inherit;text-decoration:none}
.p113 a:focus-visible{outline:0.769cqw solid var(--ac-t);outline-offset:-0.769cqw}
.p113 .stage{position:relative;overflow-x:clip;padding-top:38.462cqw;margin-top:1.538cqw}
.p113 .record{position:absolute;top:0;inset-inline-start:50%;width:76.923cqw;height:76.923cqw;margin-inline-start:-38.462cqw;border-radius:50%;
  background:
    radial-gradient(circle,transparent 0 17%,var(--ac) 17% 33%,transparent 33%),
    repeating-radial-gradient(circle,#1c1c1c 0 2px,#0c0c0c 2px 1.026cqw);
  box-shadow:0 2.051cqw 5.128cqw rgba(0,0,0,.6);animation:spin 5s linear infinite}
.p113[dir="rtl"] .record{inset-inline-start:auto;inset-inline-end:50%;margin-inline-start:0;margin-inline-end:-38.462cqw}
.p113 .record::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 20deg,transparent 0 10%,rgba(255,255,255,.14) 14%,transparent 20% 60%,rgba(255,255,255,.12) 64%,transparent 70%)}
.p113 .record::after{content:"";position:absolute;inset:44%;border-radius:50%;background:var(--blk);box-shadow:0 0 0 0.769cqw var(--cream)}

@media (prefers-reduced-motion:reduce){.p113 .record{animation:none}}
.p113 .sleeve{position:relative;background:var(--mus);min-height:92.8cqw;box-shadow:0 4.615cqw 7.692cqw rgba(0,0,0,.55);overflow:hidden;z-index:2;color:var(--blk);padding:5cqw 3.59cqw 0}
.p113 .sleeve::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.25),transparent 50%),repeating-linear-gradient(45deg,rgba(0,0,0,.025) 0 2px,transparent 2px 1.282cqw);z-index:0;pointer-events:none}
.p113 .big{--w:19.5cqw;--n:19.5cqw;position:relative;z-index:2;font-family:var(--anton);font-weight:400;font-size:min(var(--w),var(--n));line-height:.98;text-transform:uppercase;letter-spacing:-.01em;overflow-wrap:anywhere;max-width:100%}
.p113[dir="rtl"] .big{--w:14cqw;--n:14cqw;font-weight:800;letter-spacing:0;line-height:1.15}
.p113.wl2 .big{--w:15.5cqw}.p113[dir="rtl"].wl2 .big{--w:12cqw}.p113[dir="rtl"].wl3 .big{--w:9cqw}.p113.wl3 .big{--w:11cqw}
.p113.nl2 .big{--n:14.5cqw}.p113.nl3 .big{--n:10.5cqw}
.p113 .big span{display:block}
.p113 .big .o{color:var(--ac-t)}
.p113 .band{position:absolute;inset-inline:0;top:0;height:1.795cqw;background:repeating-linear-gradient(90deg,var(--blk) 0 3.59cqw,var(--ac) 3.59cqw 7.179cqw);z-index:3}

.p113 .cat{font-size:max(10px,2.564cqw);letter-spacing:.14em;text-transform:uppercase;font-weight:500;margin-top:2cqw;overflow-wrap:anywhere;line-height:1.35}

.p113 .back{background:var(--cream);color:var(--blk);padding:6.667cqw 4.103cqw 5cqw;position:relative}

.p113[dir="rtl"] .notes{font-style:normal;font-weight:600}

.p113 .credit{font-size:max(10px,2.821cqw);letter-spacing:.08em;line-height:1.7;text-transform:uppercase;color:#4a4339;margin:1.5cqw 0 4.5cqw;overflow-wrap:anywhere}
.p113[dir="rtl"] .credit{letter-spacing:0}
.p113 .track{display:grid;grid-template-columns:9.5cqw 5cqw 1fr auto;align-items:center;gap:2.564cqw;min-height:14.872cqw;border-bottom:1px solid rgba(20,17,15,.28);padding-block:1.538cqw}
.p113 .track:hover{background:rgba(240,180,41,.35)}
.p113 .track .n{font-family:var(--anton);font-size:max(12px,4.872cqw);color:var(--ac-t);letter-spacing:.04em;direction:ltr;text-align:start}
.p113 .track .n::before{content:"A"}
.p113 .track .t{min-width:0}
.p113 .track .ic{display:grid;place-items:center}
.p113 .track .nm{font-family:var(--anton);font-size:5.385cqw;letter-spacing:.05em;text-transform:uppercase;line-height:1.1;display:block;overflow-wrap:anywhere}
.p113[dir="rtl"] .track .nm{font-weight:700;letter-spacing:0}
.p113 .track .ic svg{width:4.615cqw;height:4.615cqw;stroke:var(--blk);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.p113 .track .sub{display:block;font-size:max(10px,2.949cqw);color:#4a4339;margin-top:0.769cqw;overflow-wrap:anywhere}
.p113 .track::after{content:"";width:3.2cqw;height:3.6cqw;background:var(--blk);clip-path:polygon(0 0,100% 50%,0 100%);margin-inline-end:1cqw}
.p113[dir="rtl"] .track::after{transform:scaleX(-1)}
.p113 .track .sub{direction:ltr;unicode-bidi:isolate}.p113[dir="rtl"] .track .sub{text-align:right}
</style>

<div class="stage">
    <div class="record" aria-hidden="true"></div>

</div></div>
