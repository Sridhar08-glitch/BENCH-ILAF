<style>
/* colour: warm clay paper and ink are fixed; the card accent replaces the terracotta (LED, pip, key icons, job title) */
.p124 .in{--clay:#e7dfd6;--hi:#fffaf3;--lo:#b9aa9a;--lo2:#a89887;--ink:#3b3330;--mute:#695e55;--sig:#9a4f35;--ac:color-mix(in oklab,var(--cacc) 55%,var(--sig));--ac-on:oklch(from var(--ac) clamp(0,(0.68 - l)*1000,1) 0 0);--ac-t:oklch(from var(--ac) clamp(.3,l,.5) c h);--acc:var(--ac-t)}

.p124 .in{background:var(--clay);padding:6.667cqw 5.641cqw 7.692cqw;position:relative}

.p124 .x-top{display:flex;justify-content:space-between;align-items:center;gap:3cqw;font-weight:800;font-size:max(10px,2.821cqw);letter-spacing:.18em;text-transform:uppercase;color:var(--mute)}
.p124 .x-top span:last-child{text-align:end;min-width:0;overflow-wrap:anywhere;max-width:60%;letter-spacing:.1em}
.p124 .led{display:inline-block;width:2.308cqw;height:2.308cqw;border-radius:50%;background:var(--ac);margin-inline-end:2.051cqw;box-shadow:0 0 0 0.769cqw var(--clay),0 0 0 1.026cqw rgba(0,0,0,.05),0 0 2.564cqw color-mix(in srgb,var(--ac) 60%,transparent)}
.p124 .dialwrap{display:grid;place-items:center;margin:6.667cqw 0 5.641cqw}
