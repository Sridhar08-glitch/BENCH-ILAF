# Simple checks only: the project has no formatter or linter configuration for Python, so none is forced on it.
# Install once:  pip install pre-commit && pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.(md|snap)$'
      - id: end-of-file-fixer
        exclude: '^(web/public/|web/content/|brand/|design-reference/)'
      - id: check-added-large-files
        args: ["--maxkb=1500"]
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
        exclude: '^web/(tsconfig|\.vscode)'
      - id: detect-private-key
      - id: mixed-line-ending
        args: ["--fix=lf"]
        exclude: '\.(bat|cmd|ps1)$'
